<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Content Engine Playbook logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- pipeline ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="10" opacity="0.9"/>
  <circle cx="256" cy="106" r="18" fill="#22D3EE"/>
  <circle cx="406" cy="256" r="18" fill="#A855F7"/>
  <circle cx="256" cy="406" r="18" fill="#22D3EE"/>
  <circle cx="106" cy="256" r="18" fill="#A855F7"/>

  <!-- central AI spark / node -->
  <g fill="url(#accent)">
    <rect x="236" y="176" width="40" height="40" rx="10"/>
    <rect x="176" y="236" width="40" height="40" rx="10"/>
    <rect x="296" y="236" width="40" height="40" rx="10"/>
    <rect x="236" y="296" width="40" height="40" rx="10"/>
    <rect x="236" y="236" width="40" height="40" rx="12"/>
  </g>

  <!-- connecting lines -->
  <g stroke="#22D3EE" stroke-width="6" opacity="0.6" stroke-linecap="round">
    <line x1="256" y1="216" x2="256" y2="236"/>
    <line x1="216" y1="256" x2="236" y2="256"/>
    <line x1="276" y1="256" x2="296" y2="256"/>
    <line x1="256" y1="276" x2="256" y2="296"/>
  </g>

  <!-- content bars (playbook pages) -->
  <g fill="#E2E8F0" opacity="0.85">
    <rect x="120" y="352" width="120" height="12" rx="6"/>
    <rect x="120" y="376" width="180" height="12" rx="6"/>
    <rect x="120" y="400" width="90"  height="12" rx="6"/>
  </g>
</svg>
